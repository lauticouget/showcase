version: 1
applications:
  - frontend:
      appRoot: "apps/web"
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@9.7.1 --activate
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm nx build web
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - ".next/cache/**/*"