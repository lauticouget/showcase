version: 1
applications:
  - appRoot: 'apps/web'
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@9.7.1 --activate
            - pnpm config set node-linker hoisted
            - pnpm install --frozen-lockfile
            - pnpm --dir ../.. codegen
            - git diff --exit-code -- src/lib/graphql/generated/
            - pnpm nx typecheck web
        build:
          commands:
            - pnpm nx build web
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - '.next/cache/**/*'