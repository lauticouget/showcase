networks:
  showcase-local:
    name: showcase-local
    driver: bridge

services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    networks:
      - showcase-local
    ports:
      - '8000:8000'
    command: ['-jar', 'DynamoDBLocal.jar', '-inMemory', '-sharedDb']
    healthcheck:
      test: ['CMD-SHELL', 'curl -s http://localhost:8000 > /dev/null || exit 1']
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 3s
