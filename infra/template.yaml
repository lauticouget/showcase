AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
  ClientAppUrl:
    Type: String
    Description: 'The allowed origin for CORS'

Conditions:
  IsProd: !Equals [!Ref Environment, prod]


Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - arm64
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        NODE_OPTIONS: --enable-source-maps
        ENVIRONMENT: !Ref Environment
        LOG_LEVEL: !If [IsProd, INFO, DEBUG]

Resources:
  GraphqlApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/showcase-api-${Environment}
      RetentionInDays: !If [IsProd, 90, 14]


  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref ClientAppUrl
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowCredentials: true

  GraphqlApi:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub showcase-api-${Environment}
      Handler: handler.handler
      CodeUri: ../dist/apps/api
      Events:
        GraphqlPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /graphql
            Method: POST


Outputs:
  ApiEndpoint:
    Description: GraphQL API endpoint URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/graphql
