name: Continuous Integration

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm nx affected --target=lint --base=origin/${{ github.base_ref }}
      - run: pnpm nx affected --target=typecheck --base=origin/${{ github.base_ref }}
      - run: pnpm nx affected --target=test --base=origin/${{ github.base_ref }}
      - run: pnpm nx affected --target=build --base=origin/${{ github.base_ref }}
