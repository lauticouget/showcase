name: Continuous Integration
run-name: "${{ github.ref_name }}: Continuous Integration"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Determine base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${{ github.base_ref }}" >> $GITHUB_OUTPUT
          else
            echo "ref=HEAD~1" >> $GITHUB_OUTPUT
          fi

      - run: pnpm nx affected --target=lint --base=${{ steps.base.outputs.ref }}
      - run: pnpm nx affected --target=typecheck --base=${{ steps.base.outputs.ref }}
      - run: pnpm nx affected --target=test --base=${{ steps.base.outputs.ref }}
      - run: pnpm nx build api

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: api-dist
          path: dist/apps/api
